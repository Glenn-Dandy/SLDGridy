name: sldgridy
title: SLDGridy
summary: Single-line diagrams for PV systems and transformer stations
description: |
  SLDGridy draws single-line diagrams (one-line / Einstrich-Übersichtsschaltpläne)
  for photovoltaic systems, transformer stations and low-voltage distribution.

  * Symbol library to DIN EN 60617 plus common PV symbols (PV module, inverter,
    DC storage, wallbox, selective main switches)
  * Orthogonal wires that stay connected when devices are moved, wire labels,
    bus bars and junction dots
  * Blocks with attributes, block editor, own symbol libraries, DXF import
  * Sheets with title block and viewports, printing and export to PDF, SVG, PNG
  * English and German user interface

  SLDGridy zeichnet einpolige Übersichtsschaltpläne für PV-Anlagen,
  Trafostationen und Niederspannungsverteilungen, auf Deutsch und Englisch.
license: GPL-3.0-or-later
website: https://github.com/Glenn-Dandy/SLDGridy
source-code: https://github.com/Glenn-Dandy/SLDGridy
issues: https://github.com/Glenn-Dandy/SLDGridy/issues
contact: https://github.com/Glenn-Dandy/SLDGridy/issues
icon: src/sldgridy/resources/icons/sldgridy.svg
adopt-info: sldgridy
base: core24
grade: stable
confinement: strict
platforms:
  amd64:

apps:
  sldgridy:
    command: bin/sldgridy-launch
    desktop: usr/share/applications/sldgridy.desktop
    common-id: io.github.glenn_dandy.SLDGridy
    extensions: [gnome]
    plugs:
      - home
      - removable-media
      - network
      - cups

parts:
  sldgridy:
    plugin: nil
    source: .
    build-packages:
      - python3
    stage-packages:
      - python3
      - python3-pyqt6
      - python3-pyqt6.qtsvg
      - libqt6svg6
      - qt6-wayland
      - qt6-qpa-plugins
      - libxcb-icccm4
      - libxcb-image0
      - libxcb-keysyms1
      - libxcb-render-util0
      - libxkbcommon-x11-0
      - fonts-dejavu-core
    override-build: |
      set -eu
      share="$CRAFT_PART_INSTALL/usr/share/sldgridy"
      install -d "$share"
      cp -r src/sldgridy "$share/sldgridy"
      find "$share" -name __pycache__ -type d -prune -exec rm -rf {} +
      # Library and templates live next to the module, as in the .deb.
      for d in library templates; do
        if [ -d "$share/sldgridy/resources/$d" ]; then
          mv "$share/sldgridy/resources/$d" "$share/$d"
        fi
      done
      install -D -m 0644 packaging/sldgridy.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/sldgridy.desktop"
      install -D -m 0644 src/sldgridy/resources/icons/sldgridy.svg \
        "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/sldgridy.svg"
      install -D -m 0755 snap/local/sldgridy-launch "$CRAFT_PART_INSTALL/bin/sldgridy-launch"
      version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/sldgridy/__init__.py)"
      craftctl set version="$version"
