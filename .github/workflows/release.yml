name: Release packages

# Publishing a GitHub release builds the packages:
#   pre-release vX.Y.Z-devN -> .deb attached, snap to the "edge" channel
#   release vX.Y.Z          -> .deb attached, snap to "stable"
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Install Ubuntu packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pyqt6 python3-pyqt6.qtsvg python3-pytest fonts-dejavu-core
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src:tests
        run: python3 -m pytest -q -p no:cacheprovider
      - name: Build .deb
        run: packaging/build-deb.sh
      - name: Attach .deb to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.deb --clobber

  snap:
    runs-on: ubuntu-24.04
    needs: deb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: snapcore/action-build@v1
        id: build
      - uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ github.event.release.prerelease && 'edge' || 'stable' }}
